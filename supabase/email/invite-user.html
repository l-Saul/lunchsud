<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Convite para o painel</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
    body { margin: 0; padding: 0; width: 100% !important; }
    @media (max-width: 480px) {
        .conteudo { padding: 32px 22px !important; }
    }
</style>
</head>
<body style="margin:0;padding:0;background-color:#faf7f5;">
    <!-- Prévia que aparece na caixa de entrada -->
    <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">Toque no botão para aceitar o convite e criar sua senha.</div>

    <!-- Faixa azul do cabeçalho (ícone + nome do site), igual ao site -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#003057" style="background-color:#003057;background-image:linear-gradient(180deg,#0b3a66 0%,#003057 60%,#00284a 100%);">
        <tr>
            <td align="center" style="padding:32px 16px 28px;">
                <img src="https://lunchsud.vercel.app/lunchsud180x180.png" width="72" height="72" alt="" style="display:block;margin:0 auto 14px;border:0;border-radius:16px;">
                <p style="margin:0;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:26px;font-weight:600;line-height:1.3;color:#ffffff;">Almoço dos Missionários</p>
            </td>
        </tr>
    </table>

    <!-- Fundo creme -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#faf7f5" style="background-color:#faf7f5;">
        <tr>
            <td align="center" style="padding:32px 16px 40px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">

                    <!-- Cartão branco -->
                    <tr>
                        <td>
                            <div style="background-color:#ffffff;border:1px solid #e0e2e2;border-radius:24px;overflow:hidden;">
                                <!-- Fitinha framboesa → dourado → framboesa -->
                                <div style="height:6px;line-height:6px;font-size:0;background-color:#bd0057;background-image:linear-gradient(90deg,#bd0057 0%,#ffb81c 50%,#bd0057 100%);">&nbsp;</div>

                                <div class="conteudo" style="padding:40px 32px;text-align:center;font-family:'Source Sans 3',Arial,Helvetica,sans-serif;">
                                    <!-- Divisória com florzinha -->
                                    <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto 20px;">
                                        <tr>
                                            <td width="40" style="width:40px;"><div style="height:1px;line-height:1px;font-size:0;background-color:#ffb81c;">&nbsp;</div></td>
                                            <td style="padding:0 12px;font-size:24px;line-height:24px;color:#ed3a65;">&#10047;</td>
                                            <td width="40" style="width:40px;"><div style="height:1px;line-height:1px;font-size:0;background-color:#ffb81c;">&nbsp;</div></td>
                                        </tr>
                                    </table>

                                    <h1 style="margin:0 0 16px;font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-size:30px;font-weight:600;line-height:1.25;color:#212225;">Convite para o painel</h1>
                                    <p style="margin:0 0 32px;font-size:20px;line-height:1.5;color:#212225;">Toque no botão abaixo para aceitar o convite e criar sua senha.</p>

                                    <!-- Botão -->
                                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                        <tr>
                                            <td align="center" bgcolor="#006184" style="background-color:#006184;border-radius:12px;">
                                                <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=invite&next=/redefinir-senha" target="_blank" style="display:block;padding:18px 24px;font-family:'Source Sans 3',Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;line-height:1.2;color:#ffffff;text-decoration:none;border-radius:12px;">Aceitar convite</a>
                                            </td>
                                        </tr>
                                    </table>

                                    <p style="margin:32px 0 0;font-size:18px;line-height:1.5;color:#53575b;">Caso não reconheça este convite, ignore este <span style="white-space:nowrap;">e-mail</span>.</p>
                                </div>
                            </div>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
